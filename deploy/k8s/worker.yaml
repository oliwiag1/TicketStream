apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketstream-worker
  namespace: ticketstream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticketstream-worker
  template:
    metadata:
      labels:
        app: ticketstream-worker
    spec:
      containers:
        - name: worker
          image: ticketstream/api:latest
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: ticketstream-config
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: ticketstream-secrets
                  key: POSTGRES_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ticketstream-secrets
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: ticketstream-secrets
                  key: RABBITMQ_URL
