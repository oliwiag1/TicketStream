openapi: 3.0.3
info:
  title: TicketStream API
  version: 1.0.0
  description: |
    REST API for ticket reservations, payments, realtime seat updates, and user ticket history.

    Realtime channel:
    - WebSocket endpoint: ws://localhost:8080/ws/events/{eventId}
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Events
  - name: Reservation
  - name: Payment
  - name: Tickets
  - name: Realtime

paths:
  /health:
    get:
      tags: [Health]
      summary: Basic health check
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        "200":
          description: Service process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe
      responses:
        "200":
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyStatusResponse"

  /auth/provider:
    get:
      tags: [Auth]
      summary: Authentication provider info
      responses:
        "200":
          description: Provider details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviderResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /events:
    get:
      tags: [Events]
      summary: List events
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"

    post:
      tags: [Events]
      summary: Create event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEventResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /events/{eventId}/seats:
    get:
      tags: [Events]
      summary: List seats for event
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Seats map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatsResponse"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/{eventId}/reserve:
    post:
      tags: [Reservation]
      summary: Reserve seat for event
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveRequest"
      responses:
        "202":
          description: Seat locked and reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReserveResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Seat conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pay:
    post:
      tags: [Payment]
      summary: Pay reservation
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayRequest"
      responses:
        "200":
          description: Payment accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Reservation conflict or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reservations/{reservationId}:
    delete:
      tags: [Reservation]
      summary: Cancel reservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReservationId"
      responses:
        "200":
          description: Reservation released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelReservationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tickets/me:
    get:
      tags: [Tickets]
      summary: List current user paid tickets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Paid tickets list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyTicketsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ws/events/{eventId}:
    get:
      tags: [Realtime]
      summary: Realtime seat updates (WebSocket upgrade)
      description: |
        Upgrade HTTP connection to WebSocket and subscribe to seat status updates for an event.
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "101":
          description: Switching Protocols

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EventId:
      in: path
      name: eventId
      required: true
      schema:
        type: string
    ReservationId:
      in: path
      name: reservationId
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid auth token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]

    DependencyStatusResponse:
      type: object
      properties:
        status:
          type: string
        dependency:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    AuthProviderResponse:
      type: object
      properties:
        provider:
          type: string
        issuer:
          type: string
        audience:
          type: string
      required: [provider, issuer, audience]

    CurrentUserResponse:
      type: object
      properties:
        sub:
          type: string
        preferred_username:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        scope:
          type: string
      required: [sub]

    EventItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        starts_at:
          type: string
          format: date-time
      required: [id, title, starts_at]

    EventsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventItem"
        meta:
          type: object
          additionalProperties: true
      required: [items]

    CreateEventRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        seat_rows:
          type: array
          items:
            type: string
        seats_per_row:
          type: integer
      required: [title, starts_at]

    CreateEventResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        seats_created:
          type: integer
      required: [id, message, seats_created]

    SeatItem:
      type: object
      properties:
        id:
          type: string
        row:
          type: string
        number:
          type: integer
        status:
          type: string
          enum: [available, locked, sold]
      required: [id, row, number, status]

    SeatsResponse:
      type: object
      properties:
        event_id:
          type: string
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatItem"
      required: [event_id, seats]

    ReserveRequest:
      type: object
      properties:
        seat_id:
          type: string
      required: [seat_id]

    ReserveResponse:
      type: object
      properties:
        reservation_id:
          type: string
        event_id:
          type: string
        seat_id:
          type: string
        status:
          type: string
        expires_at:
          type: string
          format: date-time
      required: [reservation_id, event_id, seat_id, status]

    PayRequest:
      type: object
      properties:
        reservation_id:
          type: string
        payment_method:
          type: string
      required: [reservation_id, payment_method]

    PayResponse:
      type: object
      properties:
        status:
          type: string
        reservation_id:
          type: string
        already_paid:
          type: boolean
      required: [status, reservation_id]

    CancelReservationResponse:
      type: object
      properties:
        message:
          type: string
        reservation_id:
          type: string
      required: [message, reservation_id]

    TicketItem:
      type: object
      properties:
        reservation_id:
          type: string
        event_id:
          type: string
        event_title:
          type: string
        event_starts_at:
          type: string
          format: date-time
        seat_id:
          type: string
        seat_row:
          type: string
        seat_number:
          type: integer
        status:
          type: string
        purchased_at:
          type: string
          format: date-time
      required:
        - reservation_id
        - event_id
        - event_title
        - event_starts_at
        - seat_id
        - seat_row
        - seat_number
        - status
        - purchased_at

    MyTicketsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TicketItem"
      required: [items]
