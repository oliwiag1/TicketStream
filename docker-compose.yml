services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticketstream-api
    command: ["api"]
    env_file:
      - ./backend/.env.example
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
      - rabbitmq
      - keycloak

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticketstream-worker
    command: ["worker"]
    env_file:
      - ./backend/.env.example
    depends_on:
      - db
      - redis
      - rabbitmq

  db:
    image: postgres:16-alpine
    container_name: ticketstream-db
    environment:
      POSTGRES_DB: ticketstream
      POSTGRES_USER: ticketstream
      POSTGRES_PASSWORD: ticketstream
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ticketstream-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ticketstream-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: ticketstream-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "18081:8080"
    volumes:
      - ./deploy/keycloak/realm-ticketstream.json:/opt/keycloak/data/import/realm-ticketstream.json:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticketstream-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
