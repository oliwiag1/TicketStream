services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticketstream-api
    command: ["api"]
    env_file:
      - ./backend/.env.example
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticketstream-worker
    command: ["worker"]
    env_file:
      - ./backend/.env.example
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: ticketstream-db
    environment:
      POSTGRES_DB: ticketstream
      POSTGRES_USER: ticketstream
      POSTGRES_PASSWORD: ticketstream
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketstream -d ticketstream"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ticketstream-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ticketstream-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: ticketstream-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "18081:8080"
    restart: unless-stopped
    volumes:
      - ./deploy/keycloak/realm-ticketstream.json:/opt/keycloak/data/import/realm-ticketstream.json:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticketstream-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
